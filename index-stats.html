<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matchday Availability</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --brand-deep:#3A1707;
    --brand:#E2631B;
    --brand-light:#F0854A;
    --line:#FBF3EA;
    --card:#FFFFFF;
    --ink:#291508;
    --ink-soft:#7A5A48;
    --amber:#FFC93C;
    --amber-deep:#E6A91E;
    --red:#A62639;
    --red-soft:#F7DEE0;
    --ok-soft:#FBEEDD;
    --good:#2E7D46;
    --good-soft:#E1F1E4;
    --border:#EAD9C8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--brand-deep);
    background-image:
      repeating-linear-gradient(90deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 64px);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding-bottom:60px;
  }
  .display{font-family:'Bebas Neue',sans-serif; letter-spacing:0.03em;}

  .header{
    padding:24px 20px 16px;
    color:var(--line);
    position:relative;
    overflow:hidden;
    display:flex;
    align-items:center;
    gap:14px;
  }
  .crest{ flex-shrink:0; width:50px; height:auto; max-height:56px; object-fit:contain; position:relative; z-index:1; }
  .title-block{ position:relative; z-index:1; min-width:0; }
  .club-name{
    font-size:32px; line-height:0.92; color:var(--amber); margin:0 0 3px;
  }
  .tracker-label{
    font-size:11px; text-transform:uppercase; letter-spacing:0.14em;
    color:rgba(251,243,234,0.7); font-weight:700; font-family:'Inter',sans-serif;
  }

  .user-bar{
    display:none; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px;
    padding:8px 20px 14px; color:rgba(251,243,234,0.75); font-size:12px; font-weight:600;
  }
  .user-bar-left{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .welcome-text{ color:rgba(251,243,234,0.75); }
  .linked-child-pill{
    background:rgba(255,201,60,0.15); border:1px solid rgba(255,201,60,0.4);
    color:var(--amber); padding:3px 10px; border-radius:12px; font-size:11px; font-weight:700;
  }
  .user-bar-signout{
    background:transparent; border:1px solid rgba(255,255,255,0.25); color:rgba(251,243,234,0.85);
    padding:5px 12px; border-radius:20px; font-size:11.5px; font-weight:700; cursor:pointer; font-family:'Inter';
  }

  .sheet-switch{
    display:flex; gap:8px; padding:0 20px; margin-top:8px;
  }
  .sheet-btn{
    flex:1; padding:12px 10px; border-radius:10px; cursor:pointer;
    background:rgba(255,255,255,0.06); border:1.5px solid rgba(255,255,255,0.14);
    color:rgba(239,237,226,0.8); transition:all .15s ease;
  }
  .sheet-btn.active{ background:var(--amber); border-color:var(--amber); color:var(--brand-deep); }
  .sheet-btn .sb-title{ font-family:'Bebas Neue'; font-size:19px; letter-spacing:0.03em; }

  .tabs{
    display:flex; gap:6px; padding:0 20px; margin-top:14px;
  }
  .tab{
    flex:1; text-align:center; padding:12px 8px;
    font-family:'Bebas Neue'; font-size:17px; letter-spacing:0.04em;
    color:rgba(239,237,226,0.55);
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.1);
    border-bottom:none;
    border-radius:10px 10px 0 0;
    cursor:pointer;
    transition:all .15s ease;
  }
  .tab.active{
    color:var(--brand-deep);
    background:var(--line);
  }

  .panel{
    background:var(--line);
    margin:0 12px 12px;
    border-radius:0 12px 12px 12px;
    padding:18px 16px 22px;
    min-height:400px;
  }
  @media(min-width:520px){ .panel{margin:0 20px 20px; padding:22px 24px 26px;} }

  .section-label{
    font-family:'Bebas Neue'; font-size:15px; letter-spacing:0.06em;
    color:var(--brand); margin:0 0 10px;
    display:flex; align-items:center; gap:8px;
  }
  .section-label::before{content:""; width:8px; height:8px; background:var(--amber); border-radius:2px;}

  .my-child-label{
    font-family:'Bebas Neue'; font-size:24px; color:var(--brand-deep);
    background:#fff; border:1.5px solid var(--border); border-radius:10px;
    padding:10px 16px; margin-bottom:14px; display:inline-block;
  }

  .player-picker{
    display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;
  }
  .player-chip{
    padding:8px 14px; border-radius:20px; font-size:13.5px; font-weight:600;
    background:#fff; border:1.5px solid var(--border); cursor:pointer; color:var(--ink);
    transition:all .12s ease;
  }
  .player-chip.selected{
    background:var(--brand); border-color:var(--brand); color:#fff;
  }
  .add-player-row{display:flex; gap:8px; margin-bottom:6px;}
  .add-player-row input{
    flex:1; padding:9px 12px; border-radius:8px; border:1.5px solid var(--border);
    font-size:13.5px; font-family:'Inter'; min-width:0;
  }
  .btn{
    padding:9px 16px; border-radius:8px; border:none; font-weight:700; font-size:13px;
    cursor:pointer; font-family:'Inter'; white-space:nowrap;
  }
  .btn-amber{background:var(--amber); color:var(--brand-deep);}
  .btn-amber:hover{background:var(--amber-deep);}
  .btn-ghost{background:transparent; color:var(--ink-soft); border:1.5px solid var(--border);}
  .btn-brand{background:var(--brand); color:#fff;}

  .hint{font-size:12.5px; color:var(--ink-soft); margin:2px 0 16px; line-height:1.5;}
  .hint b{color:var(--ink);}

  .sat-row{
    background:#fff; border:1.5px solid var(--border); border-radius:10px;
    padding:12px 14px; margin-bottom:10px;
  }
  .sat-row-head{
    display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px;
  }
  .sat-date{font-weight:800; font-size:14.5px;}
  .extra-badge{
    font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:0.03em;
    background:var(--amber); color:var(--brand-deep); padding:2px 7px; border-radius:10px; vertical-align:middle;
  }
  .matchtype-badge{
    font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:0.03em;
    background:transparent; border:1.5px solid var(--brand); color:var(--brand);
    padding:1px 7px; border-radius:10px; vertical-align:middle;
  }
  .cancelled-badge{
    background:var(--red); color:#fff; font-weight:800; text-transform:uppercase; letter-spacing:0.05em;
    font-size:11px; padding:5px 12px; border-radius:6px; display:inline-block; margin-bottom:10px;
  }
  .sat-row.cancelled, .summary-row.cancelled{ opacity:0.65; border-color:var(--red); border-style:dashed; }
  .cancel-toggle-btn{ margin-top:8px; }
  .fixture-line{
    font-size:12.5px; color:var(--ink-soft); font-weight:600; margin-bottom:10px; cursor:pointer;
  }
  .fixture-line.empty{ color:#B8A594; font-style:italic; font-weight:500; }
  .fixture-line .edit-ic{ font-size:11px; opacity:0.6; margin-left:4px; }
  .fixture-row{ line-height:1.5; }
  .fixture-readonly{ font-size:12.5px; color:var(--ink-soft); font-weight:600; margin-bottom:10px; }
  .w3w-link{ color:var(--brand); text-decoration:underline; font-weight:700; }
  .fixture-edit{ margin-bottom:10px; padding:10px; background:var(--ok-soft); border-radius:8px; }
  /* Unified Admin entry-control appearance */
  :root{ --admin-control-bg:#f1eee9; }
  .fx-input,
  .admin-card input:not([type="checkbox"]):not([type="radio"]),
  .admin-card select,
  .admin-card textarea,
  .admin-form input:not([type="checkbox"]):not([type="radio"]),
  .admin-form select,
  .admin-form textarea,
  #newPlayerInput,
  #teamNameSettingsInput,
  #settingsMatchMinPlayers,
  #settingsTrainingMinPlayers,
  #settingsMatchDay,
  #settingsTrainingDay,
  #parentNameInput,
  #parentEmailInput,
  #extraSlotsInput,
  #extraOpponentInput,
  #extraKoTimeInput,
  #extraLocationInput,
  #extraMatchTypeSelect,
  #extraW3WInput,
  #bulkTrainingTime,
  #bulkTrainingLocation,
  #bulkTrainingW3W{
    background:var(--admin-control-bg) !important;
    color:var(--ink) !important;
  }
  .admin-card input:not([type="checkbox"]):not([type="radio"]),
  .admin-card select,
  .admin-card textarea,
  .admin-form input:not([type="checkbox"]):not([type="radio"]),
  .admin-form select,
  .admin-form textarea,
  #newPlayerInput, #teamNameSettingsInput, #settingsMatchMinPlayers,
  #settingsTrainingMinPlayers, #settingsMatchDay, #settingsTrainingDay,
  #parentNameInput, #parentEmailInput, #extraSlotsInput, #extraOpponentInput,
  #extraKoTimeInput, #extraLocationInput, #extraMatchTypeSelect, #extraW3WInput,
  #bulkTrainingTime, #bulkTrainingLocation, #bulkTrainingW3W{
    box-sizing:border-box;
  }
  select.fx-input,
  #settingsMatchDay, #settingsTrainingDay, #extraMatchTypeSelect{
    background:var(--admin-control-bg) !important;
  }
  .centred-date-field .date-display{
    background:var(--admin-control-bg) !important;
    color:var(--ink) !important;
  }

  .fx-input{
    width:100%; padding:8px 10px; border-radius:6px; border:1.5px solid var(--border);
    font-size:13px; font-family:'Inter'; margin-bottom:6px;
    background:var(--admin-control-bg); color:var(--ink);
  }
  select.fx-input{
    background:var(--admin-control-bg) !important;
    color:var(--ink) !important;
  }
  .fx-actions{ display:flex; gap:8px; margin-top:4px; }
  .fx-actions .btn{ flex:1; padding:7px; font-size:12px; }
  .slot-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:6px;}
  .slot-btn{
    padding:10px 4px; text-align:center; border-radius:8px; border:1.5px solid var(--border);
    font-size:13px; font-weight:700; background:#fafaf7; cursor:pointer; color:var(--ink-soft);
    transition:all .12s ease;
  }
  .slot-btn.out{
    background:var(--red-soft); border-color:var(--red); color:var(--red);
  }
  .full-out-btn{
    margin-top:8px; width:100%; padding:8px; border-radius:8px; border:1.5px dashed var(--border);
    background:transparent; font-size:12px; font-weight:700; color:var(--ink-soft); cursor:pointer;
  }
  .full-out-btn.active{
    border-style:solid; border-color:var(--red); background:var(--red-soft); color:var(--red);
  }
  .single-toggle-btn{
    width:100%; padding:12px; border-radius:8px; border:1.5px solid var(--border);
    background:#fafaf7; font-size:13.5px; font-weight:700; color:var(--ink-soft); cursor:pointer;
    transition:all .12s ease;
  }
  .single-toggle-btn.out{
    background:var(--red-soft); border-color:var(--red); color:var(--red);
  }
  .reason-row{ margin-top:10px; padding-top:10px; border-top:1px dashed var(--border); }
  .reason-label{ font-size:11px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.03em; margin-bottom:6px; }
  .reason-chips{ display:flex; gap:6px; margin-bottom:8px; }
  .reason-chip{
    padding:6px 12px; border-radius:20px; font-size:12px; font-weight:700;
    background:#fafaf7; border:1.5px solid var(--border); color:var(--ink-soft); cursor:pointer;
  }
  .reason-chip.selected{ background:var(--brand); border-color:var(--brand); color:#fff; }
  .reason-note-input{
    width:100%; padding:8px 10px; border-radius:6px; border:1.5px solid var(--border);
    font-size:12.5px; font-family:'Inter';
  }

  .summary-row{
    background:#fff; border:1.5px solid var(--border); border-radius:10px;
    padding:12px 14px; margin-bottom:10px;
  }
  .summary-row.short{border-color:var(--red); background:var(--red-soft);}
  .summary-head{display:flex; justify-content:space-between; align-items:baseline;}
  .summary-date{font-weight:800; font-size:14.5px;}
  .slot-summary-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px;}
  .slot-summary-grid.single{grid-template-columns:1fr;}
  .slot-summary{
    border-radius:8px; padding:8px 6px; text-align:center; background:var(--ok-soft);
    border:1.5px solid transparent; cursor:pointer; transition:transform .08s ease;
  }
  .slot-summary:active{ transform:scale(0.97); }
  .slot-summary.warn{background:var(--red-soft); border-color:var(--red);}
  .slot-summary.good{background:var(--good-soft); border-color:var(--good);}
  .slot-summary .slot-time{font-size:10.5px; color:var(--ink-soft); font-weight:700; text-transform:uppercase; letter-spacing:0.03em; margin-bottom:2px;}
  .count-row{display:flex; align-items:baseline; justify-content:center; gap:4px;}
  .slot-summary .count{font-family:'Bebas Neue'; font-size:26px; line-height:1; color:var(--brand);}
  .slot-summary.warn .count{color:var(--red);}
  .slot-summary.good .count{color:var(--good);}
  .avail-suffix{font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.02em; color:var(--ink-soft);}
  .slot-summary.warn .avail-suffix{color:var(--red);}
  .slot-summary.good .avail-suffix{color:var(--good);}
  .slot-detail{
    margin-top:10px; padding:10px 12px; background:#fff; border:1.5px solid var(--border); border-radius:8px;
    font-size:12.5px; line-height:1.6;
  }
  .slot-detail .detail-block{ margin-bottom:6px; }
  .slot-detail .detail-block:last-child{ margin-bottom:0; }
  .slot-detail b{ color:var(--ink); }
  .slot-detail .not-avail b{ color:var(--red); }
  .slot-detail .avail b{ color:var(--good); }
  .flag-pill{
    font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:0.04em;
    color:var(--red); background:#fff; border:1.5px solid var(--red);
    padding:3px 8px; border-radius:20px;
  }
  .roster-count{
    font-size:12px; color:var(--ink-soft); margin-bottom:14px;
  }
  .month-header{
    font-family:'Bebas Neue'; font-size:16px; letter-spacing:0.05em; color:#fff;
    background:var(--brand); padding:7px 12px; border-radius:8px; margin:18px 0 10px;
  }
  .month-header:first-of-type{margin-top:0;}
  .empty-state{
    text-align:center; padding:40px 20px; color:var(--ink-soft); font-size:13.5px;
  }
  .loading{text-align:center; padding:60px 20px; color:rgba(239,237,226,0.6); font-family:'Bebas Neue'; font-size:18px;}

  .login-screen{ text-align:center; padding:56px 16px; }
  .login-title{ font-family:'Bebas Neue'; font-size:24px; color:var(--brand-deep); margin-bottom:8px; }
  .login-sub{ font-size:13px; color:var(--ink-soft); margin-bottom:22px; max-width:320px; margin-left:auto; margin-right:auto; line-height:1.5; }
  .login-btn{ padding:13px 28px; font-size:14px; }

  .admin-subtabs{
    display:grid !important;
    grid-template-columns:repeat(3,minmax(0,1fr)) !important;
    gap:8px;
    width:100%;
    max-width:100%;
    box-sizing:border-box;
    margin-bottom:16px;
  }
  .admin-subtab{
    min-width:0 !important;
    width:100% !important;
    max-width:100% !important;
    box-sizing:border-box !important;
    overflow:hidden;
    white-space:normal;
    overflow-wrap:anywhere;
    word-break:normal;
    text-align:center;
    padding:9px 5px;
    border-radius:8px;
    cursor:pointer;
    font-size:12.5px;
    font-weight:700;
    background:#fff;
    border:1.5px solid var(--border);
    color:var(--ink-soft);
  }
  .admin-subtab.active{ background:var(--brand); border-color:var(--brand); color:#fff; }
  .admin-list{ margin-bottom:16px; }
  .admin-list-row{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    background:#fff; border:1.5px solid var(--border); border-radius:8px;
    padding:9px 12px; margin-bottom:8px; font-size:13px;
  }
  .admin-list-row span{ word-break:break-word; }
  .admin-remove{ padding:5px 12px; font-size:11.5px; flex-shrink:0; }
  .admin-form{
    background:#fff; border:1.5px solid var(--border); border-radius:10px; padding:14px;
  }
  .admin-form input{
    width:100%; padding:9px 12px; border-radius:8px; border:1.5px solid var(--border);
    font-size:13.5px; font-family:'Inter'; margin-bottom:10px;
  }
  .admin-child-picker{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
  .admin-label-sm{ font-size:11px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.03em; margin-bottom:6px; }

  .weekly-comms-card{background:#fff;border:1.5px solid var(--border);border-radius:10px;padding:14px;margin-bottom:14px;}
  .weekly-comms-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .weekly-comms-preview{width:100%;min-height:360px;padding:12px;border:1.5px solid var(--border);border-radius:8px;background:#fafaf7;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.55;white-space:pre-wrap;resize:vertical;}
  .weekly-comms-note{font-size:12px;color:var(--ink-soft);line-height:1.5;margin:6px 0 0;}

  /* iPhone date controls: fixed-height custom shell with a transparent native
     date input over the top. This keeps the native iOS date picker functional
     while giving the closed/empty state a stable height and black text. */
  .centred-date-field{
    position:relative !important;
    box-sizing:border-box !important;
    width:calc(100% - 16px) !important;
    max-width:calc(100% - 16px) !important;
    min-width:0 !important;
    height:44px !important;
    margin:0 auto !important;
    overflow:visible !important;
  }
  .centred-date-field .date-display{
    position:absolute !important;
    inset:0 !important;
    box-sizing:border-box !important;
    display:flex !important;
    align-items:center !important;
    padding:0 10px !important;
    border:1.5px solid var(--border) !important;
    border-radius:8px !important;
    background:#f1eee9 !important;
    color:var(--ink) !important;
    font-family:'Inter' !important;
    font-size:13.5px !important;
    line-height:1 !important;
    pointer-events:none !important;
  }
  .centred-date-field:focus-within .date-display{
    border-color:var(--brand) !important;
  }
  .centred-date-field input[type="date"]{
    position:absolute !important;
    inset:0 !important;
    z-index:2 !important;
    display:block !important;
    box-sizing:border-box !important;
    width:100% !important;
    height:44px !important;
    max-width:100% !important;
    min-width:0 !important;
    margin:0 !important;
    padding:0 !important;
    border:0 !important;
    background:transparent !important;
    color:transparent !important;
    opacity:0 !important;
    -webkit-appearance:none !important;
    appearance:none !important;
  }

  @media(max-width:519px){
    .bulk-training-date-row{
      grid-template-columns:1fr !important;
      gap:10px !important;
    }
    .bulk-training-date-row > .centred-date-field{
      width:calc(100% - 16px) !important;
      max-width:calc(100% - 16px) !important;
      margin-left:auto !important;
      margin-right:auto !important;
    }
  }

  .parent-link-summary{
    background:#fff;border:1.5px solid var(--border);border-radius:10px;
    padding:14px;margin-bottom:14px;
  }
  .parent-link-summary-head{
    display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;
  }
  .parent-link-summary-title{
    font-family:'Bebas Neue';font-size:17px;letter-spacing:.04em;color:var(--brand-deep);
  }
  .parent-link-summary-count{
    font-size:11px;font-weight:800;padding:4px 8px;border-radius:20px;
  }
  .parent-link-summary-count.good{background:var(--good-soft);color:var(--good);}
  .parent-link-summary-count.warn{background:var(--red-soft);color:var(--red);}
  .parent-link-child{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:8px 0;border-top:1px solid var(--line);font-size:13px;
  }
  .parent-link-child:first-child{border-top:none;}
  .parent-link-child-name{font-weight:800;}
  .parent-link-child-status{font-size:11.5px;font-weight:800;white-space:nowrap;}
  .parent-link-child-status.good{color:var(--good);}
  .parent-link-child-status.warn{color:var(--red);}
  .parent-link-parent-names{font-size:10.5px;color:var(--ink-soft);font-weight:600;margin-left:6px;}

  .weekly-comms-week-buttons{display:flex;gap:7px;margin-top:8px}
  .weekly-comms-week-buttons .btn{flex:1;min-width:0;padding:8px 5px;font-size:10.5px}
  @media(max-width:519px){
    .weekly-comms-week-buttons{gap:5px}
    .weekly-comms-week-buttons .btn{font-size:9.5px;padding:8px 3px}
  }

  .schedule-slot-row{display:flex;gap:8px;align-items:center;margin:6px 0;min-width:0}.schedule-slot-row input{flex:1;min-width:0}.schedule-slot-row button{flex:0 0 auto}

// ---- Season helpers ----
function normaliseSeasons(list){
  const out=(Array.isArray(list)?list:[]).map(x=>({name:String(x?.name||'').trim(),start:String(x?.start||'').trim()})).filter(x=>x.name&&/^\d{4}-\d{2}-\d{2}$/.test(x.start));
  const seen=new Set();
  return out.filter(x=>{const k=x.name+'|'+x.start;if(seen.has(k))return false;seen.add(k);return true;}).sort((a,b)=>a.start.localeCompare(b.start));
}
function getSeasonForDate(dateKey){
  const list=normaliseSeasons(seasons);
  let match=null;
  for(const season of list){ if(season.start<=dateKey) match=season; else break; }
  return match ? match.name : null;
}
function getSeasonEndDate(index){
  const list=normaliseSeasons(seasons);
  if(!list[index]) return null;
  if(list[index+1]){ const d=new Date(list[index+1].start+'T00:00:00'); d.setDate(d.getDate()-1); return isoDate(d); }
  return null;
}
function getDashboardSeason(){
  const today=new Date();
  const key=isoDate(new Date(today.getFullYear(),today.getMonth(),today.getDate()));
  return getSeasonForDate(key) || normaliseSeasons(seasons)[normaliseSeasons(seasons).length-1]?.name || '2026/27';
}
function seasonOptions(){
  return normaliseSeasons(seasons).map(x=>x.name);
}

// ---- Date helpers ----

function getMonthWindowDates(dayOfWeek){
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const end = new Date(now.getFullYear(), now.getMonth() + 12, 0); // last day of month+11
  const out = [];
  let d = new Date(today);
  const diff = (dayOfWeek - d.getDay() + 7) % 7;
  d.setDate(d.getDate() + diff);
  d.setHours(0,0,0,0);
  while(d <= end){
    out.push(new Date(d));
    d.setDate(d.getDate() + 7);
  }
  return out;
}
function isoDate(d){
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function timeAgo(ts){
  if(!ts) return 'never';
  const diffMs = Date.now() - ts;
  const mins = Math.floor(diffMs / 60000);
  if(mins < 1) return 'just now';
  if(mins < 60) return `${mins}m ago`;
  const hours = Math.floor(mins / 60);
  if(hours < 24) return `${hours}h ago`;
  const days = Math.floor(hours / 24);
  if(days < 30) return `${days}d ago`;
  return new Date(ts).toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'});
}
function ordinalSuffix(n){
  const j = n % 10, k = n % 100;
  if(j === 1 && k !== 11) return 'st';
  if(j === 2 && k !== 12) return 'nd';
  if(j === 3 && k !== 13) return 'rd';
  return 'th';
}
function fmtDate(d){
  const weekday = d.toLocaleDateString('en-GB', {weekday:'short'});
  const day = d.getDate();
  const month = d.toLocaleDateString('en-GB', {month:'short'});
  return `${weekday} ${day}${ordinalSuffix(day)} ${month}`;
}
function getDatesForSheet(type){
  const cfg = SHEETS[type];
  const regular = getMonthWindowDates(cfg.dayOfWeek);
  const regularKeys = new Set(regular.map(isoDate));
  const now = new Date();
  const todayKey = isoDate(new Date(now.getFullYear(), now.getMonth(), now.getDate()));
  const extraKeys = Object.keys(extraDates[type] || {}).filter(k => !regularKeys.has(k) && k >= todayKey);
  const extras = extraKeys.map(k => new Date(k + 'T00:00:00'));
  const all = regular.concat(extras);
  all.sort((a, b) => a - b);
  return all;
}
function isExtraDate(type, dateKey){
  return !!(extraDates[type] && extraDates[type][dateKey]);
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }

// ---- Auth ----

function doSignIn(provider){
  signInWithPopup(auth, provider).catch((e) => {
    console.error('Popup sign-in failed, falling back to redirect', e);
    signInWithRedirect(auth, provider);
  });
}
function doSignInGoogle(){ doSignIn(googleProvider); }
function doSignOut(){ signOut(auth); }

function computeIsAdmin(){
  if(!currentUser || !parentRecordLoaded){ isAdmin = false; return; }
  const email = currentUser.email.trim().toLowerCase();
  isAdmin = !!(parents[email] && parents[email].isAdmin);
}

function getMyChild(){
  if(!currentUser || !parentRecordLoaded) return null;
  const email = currentUser.email.trim().toLowerCase();
  const p = parents[email];
  return (p && p.child && roster.includes(p.child)) ? p.child : null;
}

async function loadCurrentParent(){
  if(!currentUser) return;
  const email = currentUser.email.trim().toLowerCase();
  parentRecordLoaded = false;
  parentsLoaded = false;
  try{
    const snap = await getDoc(doc(db, 'parents', email));
    if(snap.exists()) parents[email] = snap.data();
    else delete parents[email];
    parentRecordLoaded = true;
    parentsLoaded = true;
    computeIsAdmin();
  }catch(e){
    console.error('Failed to load signed-in parent record', e);
    showConnectionWarning();
    parentRecordLoaded = false;
    parentsLoaded = false;
  }
}

}

    if(snap.exists()){
      const data = snap.data();
      teamName = data.teamName || DEFAULT_TEAM_NAME;
      seasons = normaliseSeasons(data.seasons);
      if(!seasons.length) seasons = [{name:'2026/27',start:'2026-08-01'}];
      statsSeason = getDashboardSeason();
      roster = Array.isArray(data.roster) && data.roster.length ? data.roster : DEFAULT_ROSTER.slice();
      const matchMin = Number(data.matchMinPlayers);
      const trainingMin = Number(data.trainingMinPlayers);
      SHEETS.match.threshold = Number.isFinite(matchMin) && matchMin >= 1 ? matchMin : 7;
      SHEETS.training.threshold = Number.isFinite(trainingMin) && trainingMin >= 1 ? trainingMin : 7;
      const sc = data.scheduleConfig || {};
      scheduleConfig = {
        match: {
          dayOfWeek: Number.isInteger(sc.match?.dayOfWeek) ? sc.match.dayOfWeek : DEFAULT_SCHEDULE.match.dayOfWeek,
          slots: Array.isArray(sc.match?.slots) && sc.match.slots.length ? sc.match.slots : DEFAULT_SCHEDULE.match.slots
        },
        training: {
          dayOfWeek: Number.isInteger(sc.training?.dayOfWeek) ? sc.training.dayOfWeek : DEFAULT_SCHEDULE.training.dayOfWeek,
          slots: Array.isArray(sc.training?.slots) && sc.training.slots.length ? sc.training.slots : DEFAULT_SCHEDULE.training.slots
        }
      };
      SHEETS.match.dayOfWeek=scheduleConfig.match.dayOfWeek;
      SHEETS.match.slots=scheduleConfig.match.slots.map(s=>({...s}));
      SHEETS.training.dayOfWeek=scheduleConfig.training.dayOfWeek;
      SHEETS.training.slots=scheduleConfig.training.slots.map(s=>({...s}));
    }
    if(roster.length && !selectedPlayer) selectedPlayer = roster[0];
    if(roster.length && !roster.includes(selectedPlayer)) selectedPlayer = roster[0];
    render();
  }, (err) => { console.error('Settings sync error', err); showConnectionWarning(); });
}

function watchAvailability(){
  onSnapshot(collection(db, 'availability'), (snap) => {
    const next = {match:{}, training:{}};
    const metaNext = {match:{}, training:{}};
    snap.forEach(docSnap => {
      const id = docSnap.id;
      const sepIdx = id.indexOf('__');
      if(sepIdx === -1) return;
      const type = id.slice(0, sepIdx);
      const name = id.slice(sepIdx + 2);
      if(!next[type]) return;
      const data = docSnap.data();
      next[type][name] = data.dates || {};
      metaNext[type][name] = { updatedAt: data.updatedAt || null, updatedBy: data.updatedBy || '' };
    });
    availability = next;
    availabilityMeta = metaNext;
    render();
  }, (err) => { console.error('Availability sync error', err); showConnectionWarning(); });
}

// ---- Local state helpers ----

function ensurePlayerSlot(type, name, dateKey){
  if(!availability[type]) availability[type] = {};
  if(!availability[type][name]) availability[type][name] = {};
  if(!availability[type][name][dateKey]) availability[type][name][dateKey] = {};
  return availability[type][name][dateKey];
}
function slotsForDate(type, dateKey){
  const extra = extraDates[type] && extraDates[type][dateKey];
  if(extra && Array.isArray(extra.slots) && extra.slots.length){
    return extra.slots;
  }
  return SHEETS[type].slots;
}
function toggleSlot(type, name, dateKey, slotId){
  const slot = ensurePlayerSlot(type, name, dateKey);
  slot[slotId] = !slot[slotId];
  savePlayerAvailability(type, name);
  render();
}
function isFullOut(type, name, dateKey, slots){
  const slot = (availability[type][name] && availability[type][name][dateKey]) || {};
  return slots.every(s => slot[s.id]);
}
function toggleFullOut(type, name, dateKey, slots){
  const slot = ensurePlayerSlot(type, name, dateKey);
  const makeOut = !isFullOut(type, name, dateKey, slots);
  slots.forEach(s => slot[s.id] = makeOut);
  savePlayerAvailability(type, name);
  render();
}
function toggleReason(type, name, dateKey, preset){
  const slot = ensurePlayerSlot(type, name, dateKey);
  if(!slot.reason) slot.reason = {preset:'', note:''};
  if(slot.reason.preset === preset){
    slot.reason = {preset:'', note:''};
  } else {
    slot.reason = {preset, note: preset === 'Other' ? (slot.reason.note || '') : ''};
  }
  savePlayerAvailability(type, name);
  render();
}
function updateReasonNote(type, name, dateKey, note){
  const slot = ensurePlayerSlot(type, name, dateKey);
  if(!slot.reason) slot.reason = {preset:'Other', note:''};
  slot.reason.note = note;
  savePlayerAvailability(type, name);
}
function reasonText(type, name, dateKey){
  const slot = (availability[type][name] && availability[type][name][dateKey]) || {};
  const r = slot.reason;
  if(!r || !r.preset) return '';
  if(r.preset === 'Other') return r.note ? r.note : 'Other';
  return r.preset;
}

async function addPlayer(){
  const input = document.getElementById('newPlayerInput');
  const name = input.value.trim();
  if(!name) return;
  if(roster.includes(name)){ input.value=''; return; }
  roster.push(name);
  availability.match[name] = {};
  availability.training[name] = {};
  await saveSettings();
  input.value = '';
  render();
}
async function removePlayer(name){
  roster = roster.filter(n => n !== name);
  if(selectedPlayer === name) selectedPlayer = roster[0] || null;
  await saveSettings();
  render();
}
async function renamePlayer(oldName, newName){
  newName = newName.trim();
  if(!newName || newName === oldName) return;
  if(roster.includes(newName)) return; // name clash, silently ignore

  roster = roster.map(n => n === oldName ? newName : n);
  await saveSettings();

  for(const type of ['match','training']){
    const oldData = (availability[type] && availability[type][oldName]) || {};
    availability[type][newName] = oldData;
    delete availability[type][oldName];
    try{ await setDoc(doc(db, 'availability', `${type}__${newName}`), { dates: oldData }); }
    catch(e){ console.error('Failed to save renamed availability', e); showConnectionWarning(); }
    try{ await deleteDoc(doc(db, 'availability', `${type}__${oldName}`)); }
    catch(e){ /* old doc may not exist, ignore */ }
  }

  for(const email of Object.keys(parents)){
    if(parents[email].child === oldName){
      await saveParent(email, parents[email].name || '', newName, !!parents[email].isAdmin);
    }
  }

  render();
}

function matchTypeBadge(dateKey){
  if(activeSheet !== 'match') return '';
  const f = fixtures[dateKey] || {};
  if(!f.matchType) return '';
  return ` <span class="matchtype-badge">${escapeHtml(f.matchType)}</span>`;
}

function fixtureInfoRows(dateKey){
  if(activeSheet === 'match'){
    const f = fixtures[dateKey] || {};
    const row1 = [];
    if(f.opponent) row1.push(`v ${escapeHtml(f.opponent)}`);
    if(f.koTime) row1.push(`KO ${escapeHtml(f.koTime)}`);
    const row2 = [];
    if(f.location) row2.push(`@ ${escapeHtml(f.location)}`);
    if(f.what3words){
      const w3wClean = f.what3words.replace(/^\/+/, '').trim();
      const w3wUrl = `https://what3words.com/${encodeURIComponent(w3wClean)}`;
      row2.push(`w3w: <a href="${w3wUrl}" target="_blank" rel="noopener" class="w3w-link" onclick="event.stopPropagation()">${escapeHtml(w3wClean)}</a>`);
    }
    const r1 = row1.join(' · ');
    const r2 = row2.join(' · ');
    return { row1: r1, row2: r2, hasContent: !!(r1 || r2) };
  } else {
    const t = trainingInfo[dateKey] || {};
    const parts = [];
    if(t.time) parts.push(escapeHtml(t.time));
    if(t.location) parts.push(`@ ${escapeHtml(t.location)}`);
    if(t.what3words){
      const w3wClean = String(t.what3words).replace(/^\/+/, '').trim();
      if(w3wClean){
        const w3wUrl = `https://what3words.com/${encodeURIComponent(w3wClean)}`;
        parts.push(`w3w: <a href="${w3wUrl}" target="_blank" rel="noopener" class="w3w-link" onclick="event.stopPropagation()">${escapeHtml(w3wClean)}</a>`);
      }
    }
    const r1 = parts.join(' ');
    return { row1: r1, row2: '', hasContent: !!r1 };
  }
}

function wireFixtureEditing(panel){
  panel.querySelectorAll('[data-editfixture]').forEach(el => {
    el.addEventListener('click', () => { editingFixture = el.dataset.editfixture; editingTrainingInfo = null; render(); });
  });
  panel.querySelectorAll('[data-edittraining]').forEach(el => {
    el.addEventListener('click', () => { editingTrainingInfo = el.dataset.edittraining; editingFixture = null; render(); });
  });
  panel.querySelectorAll('.fx-cancel').forEach(el => {
    el.addEventListener('click', () => { editingFixture = null; editingTrainingInfo = null; render(); });
  });
  panel.querySelectorAll('.fx-save-match').forEach(el => {
    el.addEventListener('click', async () => {
      const dateKey = el.dataset.datekey;
      const container = el.closest('.fixture-edit');
      const data = {
        opponent: container.querySelector('[data-field="opponent"]').value.trim(),
        koTime: container.querySelector('[data-field="koTime"]').value.trim(),
        location: container.querySelector('[data-field="location"]').value.trim(),
        matchType: container.querySelector('[data-field="matchType"]').value,
        what3words: container.querySelector('[data-field="what3words"]').value.trim()
      };
      data.season=getSeasonForDate(dateKey);
      fixtures[dateKey] = data;
      editingFixture = null;
      render();
      await saveFixture(dateKey, data);
    });
  });
  panel.querySelectorAll('.fx-save-training').forEach(el => {
    el.addEventListener('click', async () => {
      const dateKey = el.dataset.datekey;
      const container = el.closest('.fixture-edit');
      const data = {
        time: container.querySelector('[data-field="time"]').value.trim(),
        location: container.querySelector('[data-field="location"]').value.trim(),
        what3words: container.querySelector('[data-field="what3words"]').value.trim().replace(/^\/+/, '')
      };
      trainingInfo[dateKey] = data;
      editingTrainingInfo = null;
      render();
      await saveTrainingInfo(dateKey, data);
    });
  });
}

function renderSummaryTab(){
  const panel = document.getElementById('panel');
  const cfg = SHEETS[activeSheet];
  const dates = getDatesForSheet(activeSheet);
  const squadSize = roster.length;

  let html = `<div class="section-label">Squad availability — ${cfg.label}</div>`;
  html += `<div class="roster-count">Full squad: <b>${squadSize}</b> — ${roster.join(', ') || 'no players added yet'}</div>`;

  if(squadSize === 0){
    html += `<div class="empty-state">No players added yet.</div>`;
    panel.innerHTML = html;
    return;
  }

  html += `<div class="admin-child-picker" style="margin-bottom:16px;">
    <button type="button" class="reason-chip svfilter-chip ${squadViewFilter==='all'?'selected':''}" data-svfilter="all">All sessions</button>
    <button type="button" class="reason-chip svfilter-chip ${squadViewFilter==='problem'?'selected':''}" data-svfilter="problem">Problem sessions (below ${cfg.threshold} or cancelled)</button>
  </div>`;

  // Pass 1: build a row entry per date
  const entries = dates.map((d) => {
    const key = isoDate(d);
    const dateSlots = slotsForDate(activeSheet, key);
    const multiSlot = dateSlots.length > 1;
    const info = fixtureInfoRows(key);
    let rowShort = false;
    let slotsHtml = '';
    let detailHtml = '';
    dateSlots.forEach(s => {
      const missing = roster.filter(name => {
        const slot = (availability[activeSheet][name] && availability[activeSheet][name][key]) || {};
        return !!slot[s.id];
      });
      const availableNames = roster.filter(name => !missing.includes(name));
      const available = availableNames.length;
      const warn = cfg.threshold !== null && available < cfg.threshold;
      const good = cfg.threshold !== null && available >= cfg.threshold;
      if(warn) rowShort = true;
      const slotKey = `${key}__${s.id}`;
      const isExpanded = expandedSlot === slotKey;
      slotsHtml += `<div class="slot-summary ${warn?'warn':(good?'good':'')}" data-slotkey="${slotKey}">
        ${s.label !== 'Session' ? `<div class="slot-time">${s.label}</div>` : ''}
        <div class="count-row"><span class="count">${available}</span><span class="avail-suffix">available</span></div>
      </div>`;
      if(isExpanded){
        const missingDetailed = missing.map(name => {
          const rt = reasonText(activeSheet, name, key);
          return rt ? `${name} (${escapeHtml(rt)})` : name;
        });
        detailHtml += `<div class="slot-detail">
          ${multiSlot ? `<div style="font-weight:800; margin-bottom:6px;">${s.label}</div>` : ''}
          <div class="detail-block not-avail"><b>Not available (${missing.length})</b>: ${missing.length ? missingDetailed.join(', ') : 'None — full squad available'}</div>
          <div class="detail-block avail"><b>Available (${availableNames.length})</b>: ${availableNames.length ? availableNames.join(', ') : 'None'}</div>
        </div>`;
      }
    });
    const cancelled = isCancelled(activeSheet, key);
    const effectiveRowShort = rowShort || cancelled;
    const rowHtml = `<div class="summary-row ${effectiveRowShort?'short':''} ${cancelled?'cancelled':''}">
      ${cancelled ? `<div class="cancelled-badge">🚫 Cancelled</div>` : ''}
      <div class="summary-head">
        <div class="summary-date">${fmtDate(d)}${matchTypeBadge(key)}${isExtraDate(activeSheet,key) ? ' <span class="extra-badge">Extra</span>' : ''}</div>
        ${!cancelled && rowShort ? `<div class="flag-pill">Below ${cfg.threshold}</div>` : ''}
      </div>
      ${info.hasContent ? `<div class="fixture-readonly">${info.row1 ? `<div class="fixture-row">${info.row1}</div>` : ''}${info.row2 ? `<div class="fixture-row">${info.row2}</div>` : ''}</div>` : ''}
      <div class="slot-summary-grid ${multiSlot?'':'single'}">${slotsHtml}</div>
      ${detailHtml}
    </div>`;
    return { d, key, rowShort: effectiveRowShort, rowHtml, monthKey: d.toLocaleDateString('en-GB', {month:'long', year:'numeric'}) };
  });

  // Pass 2: filter
  const filtered = squadViewFilter === 'problem' ? entries.filter(e => e.rowShort) : entries;

  if(!filtered.length){
    html += `<div class="empty-state">${squadViewFilter==='problem' ? 'No problem sessions right now — no sessions are below the threshold or cancelled.' : 'No sessions to show.'}</div>`;
    panel.innerHTML = html;
    wireSummaryFilterAndExpand(panel);
    return;
  }

  // Pass 3: render with month headers
  let lastMonth = null;
  filtered.forEach(e => {
    if(e.monthKey !== lastMonth){
      html += `<div class="month-header">${e.monthKey}</div>`;
      lastMonth = e.monthKey;
    }
    html += e.rowHtml;
  });

  panel.innerHTML = html;
  wireSummaryFilterAndExpand(panel);
}

function wireSummaryFilterAndExpand(panel){
  panel.querySelectorAll('.svfilter-chip').forEach(el => {
    el.addEventListener('click', () => { squadViewFilter = el.dataset.svfilter; render(); });
  });
  panel.querySelectorAll('.slot-summary').forEach(el => {
    el.addEventListener('click', () => {
      const key = el.dataset.slotkey;
      expandedSlot = (expandedSlot === key) ? null : key;
      render();
    });
  });
}

function getNextMondayDate(){
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const day = today.getDay();
  const daysUntilMonday = day === 0 ? 1 : 8 - day;
  const monday = new Date(today);
  monday.setDate(monday.getDate() + daysUntilMonday);
  return monday;
}
function mondayForDateInput(value){
  if(!value) return getNextMondayDate();
  const d = new Date(value + 'T00:00:00');
  if(Number.isNaN(d.getTime())) return getNextMondayDate();
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  return d;
}
function formatLongDateKey(key){
  const d = new Date(key + 'T00:00:00');
  return d.toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long'});
}
function parseTimeToMinutes(value){
  if(!value) return null;
  const m = String(value).trim().match(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/i);
  if(!m) return null;
  let h = Number(m[1]);
  const mins = Number(m[2] || 0);
  const ap = (m[3] || '').toLowerCase();
  if(ap === 'pm' && h < 12) h += 12;
  if(ap === 'am' && h === 12) h = 0;
  if(!ap && h <= 23) return h * 60 + mins;
  if(h >= 1 && h <= 12) return h * 60 + mins;
  return null;
}
function slotStartMinutes(label){
  const m = String(label || '').match(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/i);
  if(!m) return null;
  let h = Number(m[1]);
  const mins = Number(m[2] || 0);
  const ap = (m[3] || '').toLowerCase();
  if(ap === 'pm' && h < 12) h += 12;
  if(ap === 'am' && h === 12) h = 0;
  return h * 60 + mins;
}
function getRelevantMatchSlot(dateKey){
  const f = fixtures[dateKey] || {};
  const slots = slotsForDate('match', dateKey);
  if(slots.length === 1) return slots[0];
  const ko = parseTimeToMinutes(f.koTime);
  if(ko === null) return null;
  let best = null;
  let bestStart = -Infinity;
  slots.forEach(slot => {
    const start = slotStartMinutes(slot.label);
    if(start !== null && start <= ko && start >= bestStart){ best = slot; bestStart = start; }
  });
  return best || slots[0];
}
function namesForSlot(type, dateKey, slotId){
  const availableNames = [];
  const unavailableNames = [];
  roster.forEach(name => {
    const slot = (availability[type][name] && availability[type][name][dateKey]) || {};
    if(slot[slotId]) unavailableNames.push(name);
    else availableNames.push(name);
  });
  return {availableNames, unavailableNames};
}
function weeklyPlayerGrid(type, dateKey, slotId){
  const names = roster.map(name => {
    const slot = (availability[type][name] && availability[type][name][dateKey]) || {};
    const unavailable = !!slot[slotId];
    return `${unavailable ? '❌' : '✅'} ${name}`;
  });
  const cols = 3;
  const rows = [];
  for(let i=0;i<names.length;i+=cols){
    rows.push(names.slice(i,i+cols).join('    '));
  }
  return rows.join('\n');
}
function weeklyAvailabilitySummary(type, dateKey, slotId){
  let available = 0;
  roster.forEach(name => {
    const slot = (availability[type][name] && availability[type][name][dateKey]) || {};
    if(!slot[slotId]) available++;
  });
  const total = roster.length;
  const threshold = SHEETS[type]?.threshold ?? 7;
  const traffic = available >= threshold ? '🟢' : '🔴';
  return {available, total, traffic};
}
function weeklyMatchSection(dateKey){
  const f = fixtures[dateKey] || {};
  const cancelled = isCancelled('match', dateKey);
  const lines = [`*⚽ MATCH${cancelled ? ' — CANCELLED' : ''}*`, formatLongDateKey(dateKey)];
  if(f.matchType) lines.push(`Type: ${f.matchType}`);
  if(f.opponent) lines.push(`🆚 ${f.opponent}`);
  if(f.koTime) lines.push(`🕐 ${f.koTime}`);
  if(f.location) lines.push(`📍 ${f.location}`);
  if(f.what3words){
    const clean = String(f.what3words).replace(/^\/+/, '').trim();
    if(clean) lines.push(`🗺️ https://what3words.com/${encodeURIComponent(clean)}`);
  }
  if(cancelled) return lines.join('\n') + '\n🚫 *CANCELLED*';

  const slot = getRelevantMatchSlot(dateKey);
  if(slot){
    const summary = weeklyAvailabilitySummary('match', dateKey, slot.id);
    lines.push('', `👥 *${summary.available}/${summary.total} AVAILABLE* ${summary.traffic}`);
    lines.push(weeklyPlayerGrid('match', dateKey, slot.id));
  }
  return lines.join('\n');
}
function weeklyTrainingSection(dateKey){
  const t = trainingInfo[dateKey] || {};
  const cancelled = isCancelled('training', dateKey);
  const lines = [`*🏃 TRAINING${cancelled ? ' — CANCELLED' : ''}*`, formatLongDateKey(dateKey)];
  if(t.time) lines.push(`🕐 ${t.time}`);
  if(t.location) lines.push(`📍 ${t.location}`);
  if(t.what3words){
    const clean = String(t.what3words).replace(/^\/+/, '').trim();
    if(clean) lines.push(`🗺️ https://what3words.com/${encodeURIComponent(clean)}`);
  }
  if(cancelled) return lines.join('\n') + '\n🚫 *CANCELLED*';

  const slots = slotsForDate('training', dateKey);
  if(slots.length){
    const summary = weeklyAvailabilitySummary('training', dateKey, slots[0].id);
    lines.push('', `👥 *${summary.available}/${summary.total} AVAILABLE* ${summary.traffic}`);
    lines.push(weeklyPlayerGrid('training', dateKey, slots[0].id));
  }
  return lines.join('\n');
}
function getWeekSessionKeys(monday){
  const keys=[];
  for(let i=0;i<7;i++){
    const d=new Date(monday); d.setDate(d.getDate()+i); keys.push(isoDate(d));
  }
  return keys;
}
function generateWeeklyCommsMessage(){
  const monday=mondayForDateInput(weeklyCommsWeek);
  weeklyCommsWeek=isoDate(monday);
  const keys=getWeekSessionKeys(monday);

  // A fixture/training document alone is not enough to make an event part of
  // the weekly message. It must be a normal scheduled day, an active extra
  // date, or explicitly cancelled. This prevents an old orphaned test fixture
  // from appearing in WhatsApp after it has been removed from Extra Fixtures.
  const matchKeys=keys.filter(k=>{
    const regularDay=new Date(k+'T00:00:00').getDay()===SHEETS.match.dayOfWeek;
    const hasFixture=!!(fixtures[k] && Object.keys(fixtures[k]).length);
    return (regularDay && hasFixture) || !!(extraDates.match&&extraDates.match[k]) || isCancelled('match',k);
  });
  const trainingKeys=keys.filter(k=>{
    const regularDay=new Date(k+'T00:00:00').getDay()===SHEETS.training.dayOfWeek;
    const hasTraining=!!(trainingInfo[k] && Object.keys(trainingInfo[k]).length);
    return (regularDay && hasTraining) || !!(extraDates.training&&extraDates.training[k]) || isCancelled('training',k);
  });

  const sections=[`📅 ${teamName.toUpperCase()} — WEEK COMMENCING ${formatLongDateKey(isoDate(monday))}`,''];
  // Natural weekly flow: training first, then matches, with clear separators.
  sections.push('━━━━━━━━━━━━━━━━━━━━');
  if(trainingKeys.length) trainingKeys.forEach((k,i)=>{ if(i>0) sections.push('', '────────────'); sections.push(weeklyTrainingSection(k)); });
  else sections.push('*🏃 TRAINING*','', 'No training scheduled this week.');
  sections.push('', '━━━━━━━━━━━━━━━━━━━━');
  if(matchKeys.length) matchKeys.forEach((k,i)=>{ if(i>0) sections.push('', '────────────'); sections.push(weeklyMatchSection(k)); });
  else sections.push('*⚽ MATCH*','', 'No match scheduled this week.');
  return sections.join('\n');
}

    bulkTrainingTo=document.getElementById('bulkTrainingTo').value;
    bulkTrainingDay=document.getElementById('bulkTrainingDay').value;
    bulkTrainingTime=document.getElementById('bulkTrainingTime').value.trim();
    bulkTrainingLocation=document.getElementById('bulkTrainingLocation').value.trim();
    bulkTrainingW3W=document.getElementById('bulkTrainingW3W').value.trim().replace(/^\/+/, '');

    if(!bulkTrainingFrom || !bulkTrainingTo || bulkTrainingDay===''){
      alert('Please enter the date range and training day.');
      return;
    }
    if(new Date(bulkTrainingFrom+'T00:00:00') > new Date(bulkTrainingTo+'T00:00:00')){
      alert('The From date must be before the To date.');
      return;
    }

    const data={time:bulkTrainingTime,location:bulkTrainingLocation,what3words:bulkTrainingW3W};
    let count=0;
    const start=new Date(bulkTrainingFrom+'T00:00:00');
    const end=new Date(bulkTrainingTo+'T00:00:00');

    for(let d=new Date(start); d<=end; d.setDate(d.getDate()+1)){
      if(d.getDay()!==Number(bulkTrainingDay)) continue;
      const key=isoDate(d);
      await saveTrainingInfo(key,data);
      trainingInfo[key]=data;
      count++;
    }

    render();
    alert(`${count} training date${count===1?'':'s'} updated.`);
  });
}

function formatAdminDateDisplay(value){
  if(!value) return 'Select date';
  const parts=String(value).split('-');
  if(parts.length!==3) return value;
  return `${parts[2]}/${parts[1]}/${parts[0]}`;
}

  if(cancelExtraEditBtn) cancelExtraEditBtn.addEventListener('click', () => { resetExtraForm(); render(); });
  const addExtraBtn = document.getElementById('addExtraDateBtn');
  if(addExtraBtn) addExtraBtn.addEventListener('click', async () => {
    captureExtraForm();
    const dateVal = adminExtraDate;
    if(!dateVal) return;
    const labels = adminExtraSlotsRaw.split(',').map(s => s.trim()).filter(Boolean);
    const slots = labels.length
      ? labels.map((label, i) => ({ id: `e${i+1}`, label }))
      : [{ id: 'e1', label: 'Session' }];

    const newKey = `${adminExtraType}__${dateVal}`;
    if(adminExtraOriginalKey && adminExtraOriginalKey !== newKey){
      const [oldType, oldDateKey] = adminExtraOriginalKey.split('__');
      await removeExtraDate(oldType, oldDateKey);
      if(oldType === 'match' && oldDateKey !== dateVal){
        try{ await deleteDoc(doc(db, 'fixtures', oldDateKey)); }catch(e){}
        delete fixtures[oldDateKey];
      }
    }

    await saveExtraDate(adminExtraType, dateVal, slots);
    if(adminExtraType === 'match'){
      const fixtureData = {
        opponent: adminExtraOpponent.trim(),
        koTime: adminExtraKoTime.trim(),
        location: adminExtraLocation.trim(),
        matchType: adminExtraMatchType,
        what3words: adminExtraW3W.trim(),
        season: getSeasonForDate(dateVal)
      };
      if(fixtureData.opponent || fixtureData.koTime || fixtureData.location || fixtureData.matchType || fixtureData.what3words){
        fixtures[dateVal] = fixtureData;
        await saveFixture(dateVal, fixtureData);
      }
    }
    resetExtraForm();
    render();
  });
  panel.querySelectorAll('[data-removeextra]').forEach(el => {
    el.addEventListener('click', async () => {
      const [type, dateKey] = el.dataset.removeextra.split('__');
      await removeExtraDate(type, dateKey);
      render();
    });
  });
}


function statsFixtureKeys(){
  return Object.keys(fixtures).filter(k => fixtures[k] && fixtures[k].opponent).sort((a,b)=>a.localeCompare(b));
}
function statsFixtureSeason(key){
  const f=fixtures[key]||{};
  if(f.season) return String(f.season);
  return getSeasonForDate(key) || 'Unknown';
}
function statsSeasons(){
  const set=new Set(seasonOptions());
  statsFixtureKeys().map(statsFixtureSeason).forEach(x=>{if(x!=='Unknown')set.add(x);});
  return [...set].sort((a,b)=>Number(b.slice(0,4))-Number(a.slice(0,4)));
}
function statsSeasonKeys(){ return statsFixtureKeys().filter(k=>statsFixtureSeason(k)===statsSeason); }
function statsFixtureStatus(key){

}

function statsPlayerRows(){

  return roster.map(name=>{let apps=0,goals=0,assists=0,motm=0,ppotm=0;completed.forEach(k=>{const p=(results[k]?.players||[]).find(x=>x.name===name);if(p?.played)apps++;goals+=Number(p?.goals)||0;assists+=Number(p?.assists)||0;if((results[k]?.motm||[]).includes(name))motm++;if((results[k]?.ppotm||[]).includes(name))ppotm++;});return{name,apps,goals,assists,motm,ppotm,ga:goals+assists};});
}

function renderStatsOpponents(){

  document.getElementById('saveStatsResultBtn').onclick=async()=>{

    const own=Number(document.getElementById('ownGoalVal').textContent)||0;
    const goalTotal=playerData.reduce((n,p)=>n+p.goals,0)+own;
    if(goalTotal!==home){alert(`Goals entered (${goalTotal}) must equal ${teamName} score (${home}).`);return;}
    const season=getSeasonForDate(key) || f.season || r.season || statsSeason;
    const newResult={...r,status:'completed',season,homeScore:home,awayScore:away,ownGoals:own,players:playerData,motm:players.filter((p,i)=>document.querySelector(`[data-motm="${i}"]`).checked).map(p=>p.name),ppotm:players.filter((p,i)=>document.querySelector(`[data-ppotm="${i}"]`).checked).map(p=>p.name)};
    results[key]=newResult; fixtures[key]={...f,season};
    await saveFixture(key,fixtures[key]);await saveMatchResult(key,newResult);render();
  };
}

function renderTabsBar(){
  const tabsEl = document.getElementById('tabsBar');
  const myChild = getMyChild();
  const markLabel = !parentsLoaded ? 'Loading…' : (myChild || 'My availability');
  const tabsList = [
    {id:'mark', label: markLabel},
    {id:'summary', label:'Squad view'}
  ];
  tabsEl.innerHTML = tabsList.map(t => `<div class="tab ${activeTab===t.id?'active':''}" data-tab="${t.id}">${escapeHtml(t.label)}</div>`).join('');
  tabsEl.querySelectorAll('.tab').forEach(el => {
    el.addEventListener('click', () => switchTab(el.dataset.tab));
  });
}

function renderSheetSwitchBar(){
  const el = document.getElementById('sheetSwitchBar');
  const items = [
    {id:'match', label:'MATCHES'},
    {id:'training', label:'TRAINING'},
    {id:'stats', label:'STATS'}
  ];
  if(isAdmin) items.push({id:'admin', label:'ADMIN'});
  const activeId = showAdminSection ? 'admin' : activeSheet;
  el.innerHTML = items.map(it => `<div class="sheet-btn ${activeId===it.id?'active':''}" data-sheet="${it.id}"><div class="sb-title display">${it.label}</div></div>`).join('');
  el.querySelectorAll('.sheet-btn').forEach(btn => {
    btn.addEventListener('click', () => selectSection(btn.dataset.sheet));
  });
}

function updateChromeVisibility(){
  const show = !!currentUser;
  document.getElementById('sheetSwitchBar').style.display = show ? 'flex' : 'none';
  document.getElementById('tabsBar').style.display = (show && !showAdminSection && activeSheet !== 'stats') ? 'flex' : 'none';
}

function updateUserBar(){
  const bar = document.getElementById('userBar');
  if(currentUser){
    bar.style.display = 'flex';
    const myChild = getMyChild();
    const childPill = myChild ? `<span class="linked-child-pill">Linked child: ${escapeHtml(myChild)}</span>` : '';
    bar.innerHTML = `<div class="user-bar-left"><span class="welcome-text">Welcome ${escapeHtml(currentUser.name || currentUser.email)}</span>${childPill}</div><button id="signOutBtn" class="user-bar-signout">Sign out</button>`;
    document.getElementById('signOutBtn').addEventListener('click', doSignOut);
  } else {
    bar.style.display = 'none';
  }
}


function renderTeamSettingsEditor(){
  const m=document.getElementById('settingsMatchSlots');
  const t=document.getElementById('settingsTrainingSlots');
  if(!m || !t) return;

  const draw=(el,type)=>{
    el.innerHTML=scheduleConfig[type].slots.map((s,i)=>`
      <div class="schedule-slot-row">
        <input class="fx-input" data-settings-schedule-type="${type}" data-settings-schedule-index="${i}" value="${escapeAttr(s.label)}">
        <button class="btn btn-ghost" type="button" data-settings-remove="${type}" data-settings-remove-index="${i}">Remove</button>
      </div>`).join('');

    el.querySelectorAll('[data-settings-remove]').forEach(b=>b.onclick=()=>{
      const ty=b.dataset.settingsRemove, i=Number(b.dataset.settingsRemoveIndex);
      if(scheduleConfig[ty].slots.length>1){
        scheduleConfig[ty].slots.splice(i,1);
        renderTeamSettingsEditor();
      }
    });
  };

  draw(m,'match');
  draw(t,'training');

  document.getElementById('settingsAddMatchSlot')?.addEventListener('click',()=>{
    scheduleConfig.match.slots.push({id:'s'+Date.now(),label:'New slot'});
    renderTeamSettingsEditor();
  });
  document.getElementById('settingsAddTrainingSlot')?.addEventListener('click',()=>{
    scheduleConfig.training.slots.push({id:'t'+Date.now(),label:'New slot'});
    renderTeamSettingsEditor();
  });
}

function render(){
  updateChromeVisibility();
  updateUserBar();
  renderSheetSwitchBar();
  if(!currentUser){
    renderLoginScreen();
    return;
  }
  if(showAdminSection){
    renderAdminTab();
    return;
  }
  if(activeSheet === 'stats'){
    document.getElementById('tabsBar').style.display='none';
    renderStats();
    return;
  }
  renderTabsBar();
  if(activeTab === 'mark') renderMarkTab();
  else renderSummaryTab();

  renderTeamSettingsEditor();}

// ---- Init ----
render(); // instant paint (login screen or defaults) before Firebase responds

let watchersStarted = false;
onAuthStateChanged(auth, async (user) => {
  currentUser = user ? { email: (user.email || '').trim().toLowerCase(), name: user.displayName || user.email } : null;

  if(!user){
    parentRecordLoaded = false;
    parentsLoaded = false;
    parents = {};
    isAdmin = false;
    render();
    return;
  }

  // Determine the signed-in user's own parent record BEFORE rendering the
  // main app. This removes the device/browser-dependent race where a fresh
  // iPhone session could render with an empty parents object and temporarily
  // conclude that the account was not linked to a child.
  await loadCurrentParent();

  // Access tracking is deliberately stored separately from the parent record.
  // Simply opening/refreshing the app can therefore never alter child linkage
  // or admin rights in parents/{email}.
  await recordParentAccess(currentUser.email);

  if(!watchersStarted){
    watchersStarted = true;
    if(isAdmin){
      try{ await ensureSettingsSeeded(); }
      catch(e){ console.error('Seed failed', e); showConnectionWarning(); }
    }
    watchSettings();
    watchAvailability();
    watchFixtures();
    watchResults();
    watchTrainingInfo();
    // Only admins need the full parents collection. Normal parents only load
    // their own document above, reducing reads and avoiding unnecessary exposure.
    if(isAdmin){
      watchParents();
      watchParentAccess();
    }
    watchExtraDates();
    watchCancelledDates();
  }
  render();
});

getRedirectResult(auth).catch((e) => {
  console.error('Redirect sign-in error', e);
});
</script>
